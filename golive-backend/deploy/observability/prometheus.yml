global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  # Go services run in the same Docker Compose network.
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: { service: api-gateway }

  - job_name: im-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["im-gateway:8081"]
        labels: { service: im-gateway }

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:8090"]
        labels: { service: user-service }

  - job_name: room-service
    metrics_path: /metrics
    static_configs:
      - targets: ["room-service:8091"]
        labels: { service: room-service }

  - job_name: gift-service
    metrics_path: /metrics
    static_configs:
      - targets: ["gift-service:8092"]
        labels: { service: gift-service }

  - job_name: chat-service
    metrics_path: /metrics
    static_configs:
      - targets: ["chat-service:8093"]
        labels: { service: chat-service }
