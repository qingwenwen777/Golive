listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# WebRTC (mic-link). Guests publish audio-only via WHIP and the OBS mic-stage
# page subscribes via WHEP. UDP 8000 must be reachable; candidate is the
# server's public IP so browsers can reach the media port directly (STUN-only,
# no TURN required for a host with a public address).
rtc_server {
    enabled         on;
    listen          8000;
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    rtc {
        enabled     on;
        # Guests are WebRTC-only; do not bridge to/from RTMP for these streams.
        rtmp_to_rtc off;
        rtc_to_rtmp off;
    }

    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }

    publish {
        mr              off;
    }

    hls {
        enabled         off;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    dvr {
        enabled     on;
        dvr_path    /tmp/golive/records/[stream].flv;
        dvr_plan    session;
    }
    http_hooks {
        enabled         on;
        on_publish      http://room-service:8091/srs/on_publish;
        on_unpublish    http://room-service:8091/srs/on_unpublish;
    }
    exec {
        enabled         off;
    }
}
