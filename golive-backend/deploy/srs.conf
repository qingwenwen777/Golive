listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         off;
}

vhost __defaultVhost__ {
    hls {
        enabled         off;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    transcode {
        enabled     on;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        engine q720 {
            enabled         on;
            vcodec          libx264;
            vbitrate        2500;
            vfps            30;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            acodec          copy;
            output          rtmp://127.0.0.1:[port]/[app]?vhost=[vhost]/[stream]_[engine];
        }
        engine q480 {
            enabled         on;
            vcodec          libx264;
            vbitrate        900;
            vfps            30;
            vwidth          854;
            vheight         480;
            vthreads        2;
            vprofile        main;
            vpreset         veryfast;
            acodec          copy;
            output          rtmp://127.0.0.1:[port]/[app]?vhost=[vhost]/[stream]_[engine];
        }
    }
    http_hooks {
        enabled         on;
        on_publish      http://room-service:8091/srs/on_publish;
        on_unpublish    http://room-service:8091/srs/on_unpublish;
    }
}
