service:
  name: api-gateway
  http_addr: ":8080"
  pprof_addr: ":6060"
  log_level: info

upstreams:
  user_service: "http://user-service:8090"
  room_service: "http://room-service:8091"
  gift_service: "http://gift-service:8092"
  chat_service: "http://chat-service:8093"

proxy:
  timeout: 10s
  max_idle_conns: 100
  max_idle_conns_per_host: 32

jwt:
  active_kid: "jwt-rs256-2026-05-06"
  secrets:
    - kid: "jwt-rs256-2026-05-06"
      alg: "RS256"
      public_key_file: "/app/deploy/secrets/jwt_public.pem"

cors:
  allowed_origins:
    - "https://golive.us.ci"
    - "http://golive.us.ci"
    - "http://154.36.185.85"
    - "http://localhost"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  max_age: 600

csrf:
  secret: ""
  token_ttl: 12h

ratelimit:
  enabled: true
  rate_per_sec: 100
  burst: 200
  auth_rate_per_sec: 0.3
  auth_burst: 6
