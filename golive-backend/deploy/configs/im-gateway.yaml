service:
  name: im-gateway
  http_addr: ":8081"
  pprof_addr: ":6066"
  log_level: info

ws:
  read_limit_bytes: 4096
  read_idle_timeout: 60s
  write_deadline: 10s
  send_buffer: 256
  pong_wait: 60s
  max_message_rate: 5
  allowed_origins:
    - "https://golive.us.ci"
    - "http://golive.us.ci"
    - "http://154.36.185.85"
    - "http://localhost"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

redis:
  addr: "redis:6379"
  db: 0
  password: ""

jwt:
  active_kid: "jwt-rs256-2026-05-06"
  secrets:
    - kid: "jwt-rs256-2026-05-06"
      alg: "RS256"
      public_key_file: "/app/deploy/secrets/jwt_public.pem"
    - kid: "jwt-2026-05-04"
      alg: "HS256"
      secret: "golive-1718011198-jwt-7f6a9e1d4c3b2a9081726354b0c8d9ee"

kafka:
  # Disabled on purpose: im-gateway uses the noop producer + LocalEcho path so
  # chat broadcast goes directly via Redis pub/sub (im-gateway → Redis → all
  # WS clients). Persistence is handled separately by chat-service, which
  # subscribes to the SAME Redis room:* channels as a passive listener and
  # writes chats to MySQL. Turning this on routes live broadcast through
  # Kafka → chat-service → Redis instead, which adds Kafka as a hard failure
  # point for live chat — keep it false unless that pipeline is verified.
  enabled: false
  brokers: ["kafka:9092"]
  chat_topic: "danmu"

room:
  viewer_push_interval: 5s
  welcome_text: "Welcome to the live room!"
