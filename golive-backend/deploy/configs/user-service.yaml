service:
  name: user-service
  http_addr: ":8090"
  grpc_addr: ":19090"
  pprof_addr: ":6062"
  log_level: info

mysql:
  dsn: ""
  max_open: 50
  max_idle: 10

redis:
  addr: "redis:6379"
  db: 0
  password: ""

jwt:
  active_kid: "jwt-rs256-2026-05-06"
  secrets:
    - kid: "jwt-rs256-2026-05-06"
      alg: "RS256"
      private_key_file: "/app/deploy/secrets/jwt_private.pem"
      public_key_file: "/app/deploy/secrets/jwt_public.pem"
  access_ttl: 2h
  refresh_ttl: 168h

google:
  client_id: "89585115085-rgjj5j27tfiis9oml9ls1oct9u20bjuc.apps.googleusercontent.com"

email:
  enabled: true
  smtp_host: "smtp-relay.brevo.com"
  smtp_port: 2525
  smtp_username: "aa72ed001@smtp-brevo.com"
  smtp_password: ""
  sender_email: "noreply@golive.cc.cd"
  sender_name: "GoLive"
  code_ttl: 10m
  resend_interval: 60s

upload:
  avatar_dir: "/tmp/golive/avatars"
  avatar_public_url: "/api/uploads/avatars"
  cover_dir: "/tmp/golive/covers"
  cover_public_url: "/api/uploads/covers"

stripe:
  publishable_key: ""
  secret_key: ""
  currency: "usd"
  coins_per_currency_unit: 10
  connect_country: "US"

bootstrap:
  admin:
    enabled: false
    username: admin
    password: ""
    display_name: GoLive Admin
  demo_user:
    enabled: false
    username: demo
    password: ""
    coin_balance: 100000

# Shared secret for service-to-service /internal APIs; set via USERSVC_INTERNAL_TOKEN
# (docker-compose maps GOLIVE_INTERNAL_TOKEN). Empty rejects internal calls.
internal:
  token: ""
