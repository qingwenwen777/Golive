service:
  name: room-service
  http_addr: ":8091"
  pprof_addr: ":6063"
  log_level: info

mysql:
  dsn: ""
  max_open: 50
  max_idle: 10

redis:
  addr: "redis:6379"
  db: 0
  password: ""

jwt:
  active_kid: "jwt-rs256-2026-05-06"
  secrets:
    - kid: "jwt-rs256-2026-05-06"
      alg: "RS256"
      public_key_file: "/app/deploy/secrets/jwt_public.pem"

live:
  stream_key_secret: ""
  stream_key_ttl: 4h
  flv_base: "https://golive.us.ci/live"
  srs_api_base: "http://srs:1985"
  reconcile_interval: 1m

replay:
  record_dir: "/tmp/golive/records"
  bunny_library_id: ""
  bunny_api_key: ""
  bunny_api_base: "https://video.bunnycdn.com"
  bunny_player_base: "https://player.mediadelivery.net/embed"
  upload_timeout: 30m
  stale_recording_age: 24h

upload:
  cover_dir: "/tmp/golive/covers"
  cover_public_url: "/api/uploads/covers"
  post_image_dir: "/tmp/golive/posts"
  post_public_url: "/api/uploads/posts"

users:
  service_url: "http://user-service:8090"
  grpc_addr: "user-service:19090"
