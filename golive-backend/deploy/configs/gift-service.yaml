service:
  name: gift-service
  http_addr: ":8092"
  pprof_addr: ":6067"
  log_level: info

mysql:
  dsn: ""
  max_open: 50
  max_idle: 10

redis:
  addr: "redis:6379"
  db: 0
  password: ""

jwt:
  active_kid: "jwt-rs256-2026-05-06"
  secrets:
    - kid: "jwt-rs256-2026-05-06"
      alg: "RS256"
      public_key_file: "/app/deploy/secrets/jwt_public.pem"

kafka:
  enabled: false
  brokers: ["kafka:9092"]
  gift_topic: "gift"

outbox:
  poll_interval: 1s
  batch_size: 100
  max_retries: 5
  base_backoff: 2s

idempotency:
  ttl: 600s

bet:
  settle_grace: 2h            # unsettled rounds are cancelled + refunded this long after betting closes
