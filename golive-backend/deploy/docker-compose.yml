x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: golive-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${GOLIVE_MYSQL_ROOT_PASSWORD:?set GOLIVE_MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: golive
      MYSQL_USER: golive
      MYSQL_PASSWORD: ${GOLIVE_MYSQL_PASSWORD:?set GOLIVE_MYSQL_PASSWORD in deploy/.env}
    volumes: [mysql_data:/var/lib/mysql]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ugolive -p\"$${MYSQL_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: golive-redis
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  zookeeper:
    image: bitnamilegacy/zookeeper:3.9
    container_name: golive-zookeeper
    restart: unless-stopped
    logging: *default-logging
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"

  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: golive-kafka
    restart: unless-stopped
    logging: *default-logging
    depends_on: [zookeeper]
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"

  # ========== one-shot permissions job ==========

  # The Go services run as UID/GID 10001 (Dockerfile.service) without any
  # capabilities, but the upload and recording volumes were created
  # root-owned and deploy/secrets is usually readable by root only. This job
  # runs before them on every `docker compose up`, then exits:
  # - the volumes become owned by 10001:10001 (SRS keeps writing recordings
  #   as root; owning the directory is what lets room-service delete them);
  # - deploy/secrets keeps its owner and gains group 10001 with group read
  #   (directories: read + traverse). Nothing else on the host is touched.
  init-permissions:
    image: alpine:3.22
    container_name: golive-init-permissions
    restart: "no"
    logging: *default-logging
    network_mode: none
    user: "0:0"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ./secrets:/fix/secrets
      - avatar_uploads:/fix/avatars
      - cover_uploads:/fix/covers
      - post_uploads:/fix/posts
      - replay_records:/fix/records
    command:
      - /bin/sh
      - -euc
      - |
        find /fix/avatars /fix/covers /fix/posts /fix/records \( ! -user 10001 -o ! -group 10001 \) -exec chown -h 10001:10001 {} +
        find /fix/secrets ! -type l ! -group 10001 -exec chgrp 10001 {} +
        find /fix/secrets -type d ! -perm -050 -exec chmod g+rx {} +
        find /fix/secrets -type f ! -perm -040 -exec chmod g+r {} +
        echo "init-permissions: volumes and deploy/secrets are ready for UID/GID 10001"

  # ========== Go application services ==========
  # All run as UID/GID 10001 with no capabilities (they bind ports > 1024).

  user-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: user-service
    image: golive-user-service:local
    container_name: golive-user-service
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    working_dir: /app
    command: ["-config", "./deploy/configs/user-service.yaml"]
    volumes:
      - ./configs:/app/deploy/configs:ro
      - ./secrets:/app/deploy/secrets:ro
      - avatar_uploads:/tmp/golive/avatars
      - cover_uploads:/tmp/golive/covers
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      USERSVC_MYSQL_DSN: ${GOLIVE_MYSQL_DSN:?set GOLIVE_MYSQL_DSN in deploy/.env}
      USERSVC_GOOGLE_CLIENT_ID: ${USERSVC_GOOGLE_CLIENT_ID:-}
      USERSVC_EMAIL_SMTP_PASSWORD: ${USERSVC_EMAIL_SMTP_PASSWORD:-}
      USERSVC_EMAIL_SMTP_PORT: ${USERSVC_EMAIL_SMTP_PORT:-}
      USERSVC_STRIPE_PUBLISHABLE_KEY: ${USERSVC_STRIPE_PUBLISHABLE_KEY:-}
      USERSVC_STRIPE_SECRET_KEY: ${USERSVC_STRIPE_SECRET_KEY:-}
      USERSVC_STRIPE_CURRENCY: ${USERSVC_STRIPE_CURRENCY:-}
      USERSVC_STRIPE_COINS_PER_CURRENCY_UNIT: ${USERSVC_STRIPE_COINS_PER_CURRENCY_UNIT:-}
      USERSVC_INTERNAL_TOKEN: ${GOLIVE_INTERNAL_TOKEN:?set GOLIVE_INTERNAL_TOKEN in deploy/.env}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  room-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: room-service
    image: golive-room-service:local
    container_name: golive-room-service
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    working_dir: /app
    command: ["-config", "./deploy/configs/room-service.yaml"]
    volumes:
      - ./configs:/app/deploy/configs:ro
      - ./secrets:/app/deploy/secrets:ro
      - cover_uploads:/tmp/golive/covers
      - post_uploads:/tmp/golive/posts
      - replay_records:/tmp/golive/records
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ROOMSVC_MYSQL_DSN: ${GOLIVE_MYSQL_DSN:?set GOLIVE_MYSQL_DSN in deploy/.env}
      ROOMSVC_LIVE_STREAM_KEY_SECRET: ${ROOMSVC_LIVE_STREAM_KEY_SECRET:?set ROOMSVC_LIVE_STREAM_KEY_SECRET in deploy/.env}
      ROOMSVC_REPLAY_BUNNY_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-}
      ROOMSVC_REPLAY_BUNNY_API_KEY: ${BUNNY_STREAM_API_KEY:-}
      ROOMSVC_INTERNAL_TOKEN: ${GOLIVE_INTERNAL_TOKEN:?set GOLIVE_INTERNAL_TOKEN in deploy/.env}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  gift-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: gift-service
    image: golive-gift-service:local
    container_name: golive-gift-service
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    working_dir: /app
    command: ["-config", "./deploy/configs/gift-service.yaml"]
    volumes:
      - ./configs:/app/deploy/configs:ro
      - ./secrets:/app/deploy/secrets:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      GIFTSVC_MYSQL_DSN: ${GOLIVE_MYSQL_DSN:?set GOLIVE_MYSQL_DSN in deploy/.env}
      GIFTSVC_INTERNAL_TOKEN: ${GOLIVE_INTERNAL_TOKEN:?set GOLIVE_INTERNAL_TOKEN in deploy/.env}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  chat-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: chat-service
    image: golive-chat-service:local
    container_name: golive-chat-service
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    working_dir: /app
    command: ["-config", "./deploy/configs/chat-service.yaml"]
    volumes:
      - ./configs:/app/deploy/configs:ro
      - ../app/chat-service/configs/sensitive.txt:/app/app/chat-service/configs/sensitive.txt:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      CHATSVC_MYSQL_DSN: ${GOLIVE_MYSQL_DSN:?set GOLIVE_MYSQL_DSN in deploy/.env}
      CHATSVC_INTERNAL_TOKEN: ${GOLIVE_INTERNAL_TOKEN:?set GOLIVE_INTERNAL_TOKEN in deploy/.env}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-collector:
        condition: service_started

  api-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: api-gateway
    image: golive-api-gateway:local
    container_name: golive-api-gateway
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    working_dir: /app
    command: ["-config", "./deploy/configs/api-gateway.yaml"]
    volumes:
      - ./configs:/app/deploy/configs:ro
      - ./secrets:/app/deploy/secrets:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      GW_CSRF_SECRET: ${GW_CSRF_SECRET:?set GW_CSRF_SECRET in deploy/.env}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      user-service:
        condition: service_started
      room-service:
        condition: service_started
      gift-service:
        condition: service_started
      otel-collector:
        condition: service_started

  im-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: im-gateway
    image: golive-im-gateway:local
    container_name: golive-im-gateway
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    working_dir: /app
    command: ["-config", "./deploy/configs/im-gateway.yaml"]
    volumes:
      - ./configs:/app/deploy/configs:ro
      - ./secrets:/app/deploy/secrets:ro
      - ../app/chat-service/configs/sensitive.txt:/app/app/chat-service/configs/sensitive.txt:ro
    environment:
      IMGW_INTERNAL_TOKEN: ${GOLIVE_INTERNAL_TOKEN:?set GOLIVE_INTERNAL_TOKEN in deploy/.env}
    depends_on:
      init-permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  etcd:
    image: bitnamilegacy/etcd:3.5
    container_name: golive-etcd
    restart: unless-stopped
    logging: *default-logging
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379

  srs:
    image: ossrs/srs:5
    container_name: golive-srs
    restart: unless-stopped
    logging: *default-logging
    # Runs as root and keeps its default capabilities: it writes recordings
    # into replay_records, whose directory is owned by UID 10001.
    security_opt: [no-new-privileges:true]
    ports:
      - "1935:1935"
      - "8000:8000/udp"
    environment:
      CANDIDATE: ${GOLIVE_SRS_CANDIDATE:-154.36.185.85}
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro
      - replay_records:/tmp/golive/records
    command: ./objs/srs -c conf/srs.conf

  minio:
    image: minio/minio:latest
    container_name: golive-minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${GOLIVE_MINIO_ROOT_USER:?set GOLIVE_MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${GOLIVE_MINIO_ROOT_PASSWORD:?set GOLIVE_MINIO_ROOT_PASSWORD in deploy/.env}
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"

  # ========== edge reverse proxy ==========

  nginx:
    image: nginx:1.27-alpine
    container_name: golive-nginx
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    depends_on: [srs, api-gateway, im-gateway]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -c
      - |
        if [ -s /etc/letsencrypt/live/golive.us.ci/fullchain.pem ] && [ -s /etc/letsencrypt/live/golive.us.ci/privkey.pem ]; then
          exec nginx -c /etc/nginx/nginx.https.conf -g 'daemon off;'
        fi
        exec nginx -c /etc/nginx/nginx.http.conf -g 'daemon off;'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.http.conf:ro
      - ./nginx.https.conf:/etc/nginx/nginx.https.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ../../golive-web/dist:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"

  # ========== observability stack ==========

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: golive-jaeger
    restart: unless-stopped
    logging: *default-logging
    # The observability images already run as non-root users.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # UI, access through SSH tunnel if needed
      - "127.0.0.1:14268:14268"   # jaeger.thrift over HTTP
      # OTLP receivers exposed only to otel-collector (intra-network)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: golive-otel
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: golive-prometheus
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so containerized prom can scrape host services

  grafana:
    image: grafana/grafana:11.2.0
    container_name: golive-grafana
    restart: unless-stopped
    logging: *default-logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      GF_SECURITY_ADMIN_USER: ${GOLIVE_GRAFANA_ADMIN_USER:?set GOLIVE_GRAFANA_ADMIN_USER in deploy/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${GOLIVE_GRAFANA_ADMIN_PASSWORD:?set GOLIVE_GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  mysql_data:
  redis_data:
  minio_data:
  prom_data:
  grafana_data:
  cover_uploads:
  post_uploads:
  avatar_uploads:
  replay_records:
