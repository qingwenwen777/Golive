user nginx;
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  client_max_body_size 10m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  proxy_cache_path /var/cache/nginx/golive_uploads
                   levels=1:2
                   keys_zone=golive_uploads:50m
                   max_size=2g
                   inactive=30d
                   use_temp_path=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # "combined" without the query string, for /ws: WebSocket clients used to
  # send their access token as ?token=. It now rides in Sec-WebSocket-Protocol,
  # so never log $http_sec_websocket_protocol either. /ws still writes to the
  # default log file (stdout in the nginx image).
  log_format combined_no_query '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent"';

  server {
    listen 80;
    server_name golive.us.ci _;

    # SPA static
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type text/plain;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
    }

    # Public uploaded images. Keep them out of the generic /api/ no-store rule.
    location ^~ /api/uploads/ {
      set                $api_gateway http://api-gateway:8080;
      proxy_pass         $api_gateway;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Host  $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;

      proxy_cache        golive_uploads;
      proxy_cache_methods GET HEAD;
      proxy_cache_key    "$scheme$request_method$host$request_uri";
      proxy_cache_valid  200 301 302 30d;
      proxy_cache_valid  404 1m;
      proxy_cache_lock   on;
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_no_cache     $http_authorization;
      proxy_cache_bypass $http_cache_control $http_pragma;

      proxy_hide_header  Cache-Control;
      proxy_hide_header  Pragma;
      proxy_hide_header  Expires;
      proxy_hide_header  X-Request-Id;
      add_header         Cache-Control "public, max-age=2592000, immutable";
      add_header         X-Cache-Status $upstream_cache_status always;
      include            /etc/nginx/security-headers.conf;
    }

    # API gateway
    location ^~ /api/ {
      set                $api_gateway http://api-gateway:8080;
      proxy_pass         $api_gateway;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Host  $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      add_header         Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header         Pragma "no-cache" always;
      add_header         Expires "0" always;
      include            /etc/nginx/security-headers.conf;
    }

    # IM gateway WebSocket
    location /ws {
      access_log         /var/log/nginx/access.log combined_no_query;
      set                $im_gateway http://im-gateway:8081;
      proxy_pass         $im_gateway;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Host  $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      add_header         Cache-Control "no-store" always;
      include            /etc/nginx/security-headers.conf;
    }

    # SRS HTTP-FLV / HLS media. Keep SPA routes such as /live/:id on the app.
    location ~ ^/live/.+\.(?:flv|m3u8|ts)$ {
      set                $srs_http http://srs:8080;
      proxy_pass         $srs_http;
      proxy_http_version 1.1;
      proxy_buffering    off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Host  $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      add_header         Cache-Control no-cache always;
      include            /etc/nginx/security-headers.conf;
    }

    # SRS WebRTC signaling (WHIP/WHEP) for mic-link. Media flows over UDP 8000
    # directly to the SRS container's published port.
    location ^~ /rtc/ {
      set                $srs_api http://srs:1985;
      proxy_pass         $srs_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Host  $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      add_header         Cache-Control "no-store" always;
      include            /etc/nginx/security-headers.conf;
    }
  }
}
