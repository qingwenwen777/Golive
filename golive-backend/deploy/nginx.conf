user nginx;
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  client_max_body_size 10m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # SPA static
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # API gateway
    location ^~ /api/ {
      set                $api_gateway http://api-gateway:8080;
      proxy_pass         $api_gateway;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # IM gateway WebSocket
    location /ws {
      set                $im_gateway http://im-gateway:8081;
      proxy_pass         $im_gateway;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # SRS HTTP-FLV / HLS media. Keep SPA routes such as /live/:id on the app.
    location ~ ^/live/.+\.(?:flv|m3u8|ts)$ {
      set                $srs_http http://srs:8080;
      proxy_pass         $srs_http;
      proxy_http_version 1.1;
      proxy_buffering    off;
      proxy_set_header   Host $host;
      add_header         Cache-Control no-cache;
    }
  }
}
