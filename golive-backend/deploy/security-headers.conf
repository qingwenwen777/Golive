add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: http: ws: wss:; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; script-src 'self' https://accounts.google.com https://assets.mediadelivery.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://accounts.google.com https://player.mediadelivery.net; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
