add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://golive.us.ci wss://golive.us.ci ws://localhost:* ws://127.0.0.1:* https://accounts.google.com; img-src 'self' data: blob: https://api.dicebear.com https://accounts.google.com https://*.googleusercontent.com https://*.gstatic.com https://*.mediadelivery.net; media-src 'self' blob: https://*.mediadelivery.net; script-src 'self' https://accounts.google.com https://assets.mediadelivery.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://accounts.google.com https://player.mediadelivery.net; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
