service:
  name: user-service
  http_addr: ":8090"
  grpc_addr: ":19090"
  pprof_addr: ":6062"
  log_level: info

mysql:
  dsn: "golive:golive@tcp(127.0.0.1:3306)/golive?charset=utf8mb4&parseTime=True&loc=Local"
  max_open: 50
  max_idle: 10

redis:
  addr: "127.0.0.1:6379"
  db: 0
  password: ""

jwt:
  # CHANGE in production. 32+ random bytes recommended.
  secret: "dev-only-please-change-in-prod-9b1c0a"
  active_kid: "dev"
  secrets:
    - kid: "dev"
      secret: "dev-only-please-change-in-prod-9b1c0a"
  access_ttl: 2h
  refresh_ttl: 168h   # 7 days

google:
  client_id: "89585115085-rgjj5j27tfiis9oml9ls1oct9u20bjuc.apps.googleusercontent.com"

email:
  enabled: false
  smtp_host: "smtp-relay.brevo.com"
  smtp_port: 587
  smtp_username: "aa72ed001@smtp-brevo.com"
  smtp_password: ""
  sender_email: "noreply@golive.cc.cd"
  sender_name: "GoLive"
  code_ttl: 10m
  resend_interval: 60s
  # Codes one address can be sent per purpose per hour; each allows 5 guesses.
  max_codes_per_hour: 5

upload:
  avatar_dir: "./uploads/avatars"
  avatar_public_url: "/api/uploads/avatars"
  cover_dir: "./uploads/covers"
  cover_public_url: "/api/uploads/covers"

stripe:
  publishable_key: ""
  secret_key: ""
  currency: "usd"
  coins_per_currency_unit: 10
  connect_country: "US"

bootstrap:
  admin:
    enabled: false
    username: admin
    password: ""
    display_name: GoLive Admin
  # Auto-create + seed the demo user on startup. Keep disabled for production.
  demo_user:
    enabled: false
    username: demo
    password: ""
    coin_balance: 100000

# A ban ends the user's live rooms through room-service.
rooms:
  service_url: "http://127.0.0.1:8091"

# Shared secret for service-to-service /internal APIs. Every service must use
# the same value; an empty token rejects all internal calls. Env: USERSVC_INTERNAL_TOKEN.
internal:
  token: "dev-only-internal-token-change-me"
