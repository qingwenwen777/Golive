service:
  name: im-gateway
  http_addr: ":8081"
  pprof_addr: ":6066"
  log_level: info

ws:
  # Tunables sized for ~50k concurrent connections per instance.
  read_limit_bytes: 4096
  read_idle_timeout: 60s   # disconnect if nothing (heartbeat or otherwise) seen
  write_deadline: 10s
  send_buffer: 256         # per-conn outbound queue; overflow → kick
  pong_wait: 60s
  max_message_rate: 5      # client→server frames / sec / conn (all types)
  max_conns_per_user: 8    # concurrent sockets per account
  max_conns_per_ip: 64     # per client IP (see trusted_proxies)
  trusted_proxies:         # peers whose X-Real-IP / X-Forwarded-For is trusted
    - "127.0.0.1/32"
    - "::1/128"

  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"

redis:
  addr: "127.0.0.1:6379"
  db: 0
  password: ""

jwt:
  secret: "dev-only-please-change-in-prod-9b1c0a"
  active_kid: "dev"
  secrets:
    - kid: "dev"
      secret: "dev-only-please-change-in-prod-9b1c0a"

kafka:
  enabled: false           # flip to true when chat-service is up
  brokers: ["127.0.0.1:9092"]
  chat_topic: "danmu"

room:
  viewer_push_interval: 5s
  welcome_text: "Welcome to the live room!"
  require_known: true      # reject roomIds room-service doesn't know
  service_url: "http://127.0.0.1:8091"

# Chat identity (name / avatar / level / fan badge) is resolved server-side
# by user id; client-sent values are ignored.
profile:
  user_service_url: "http://127.0.0.1:8090"
  chat_service_url: "http://127.0.0.1:8093"
  ttl: 30s

# Sensitive words are masked in live chat (same list chat-service uses).
filter:
  sensitive_path: "./app/chat-service/configs/sensitive.txt"
  mask: "***"

# Per-user chat limit, shared across all of a user's connections via Redis.
chat_ratelimit:
  per_user_per_sec: 3
  bucket_seconds: 1        # integer seconds

# Shared secret for service-to-service /internal APIs. Every service must use
# the same value; an empty token rejects all internal calls. Env: IMGW_INTERNAL_TOKEN.
internal:
  token: "dev-only-internal-token-change-me"
