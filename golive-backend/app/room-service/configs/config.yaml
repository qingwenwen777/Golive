service:
  name: room-service
  http_addr: ":8091"
  pprof_addr: ":6063"
  log_level: info

mysql:
  dsn: "golive:golive@tcp(127.0.0.1:3306)/golive?charset=utf8mb4&parseTime=True&loc=Local"
  max_open: 50
  max_idle: 10

redis:
  addr: "127.0.0.1:6379"
  db: 0
  password: ""

jwt:
  # MUST match user-service. Same HS256 secret verifies access tokens here.
  secret: "dev-only-please-change-in-prod-9b1c0a"
  active_kid: "dev"
  secrets:
    - kid: "dev"
      secret: "dev-only-please-change-in-prod-9b1c0a"

live:
  # HMAC key for stream key generation. Different from JWT secret.
  stream_key_secret: "dev-stream-key-secret-change-me"
  stream_key_ttl: 4h
  flv_base: "http://localhost:8082/live"
  # SRS http_api; used to disconnect the publisher when a live is stopped.
  srs_api_base: "http://127.0.0.1:1985"
  # How often live rooms are checked against SRS so rooms whose publisher is
  # gone (lost on_unpublish, restart during the unpublish grace) get ended.
  reconcile_interval: 1m

replay:
  record_dir: "./records"
  bunny_library_id: ""
  bunny_api_key: ""
  bunny_api_base: "https://video.bunnycdn.com"
  bunny_player_base: "https://player.mediadelivery.net/embed"
  upload_timeout: 30m
  # Recordings untouched this long that no live room or pending replay
  # upload needs are removed (failed uploads, mic-link streams, leftovers).
  stale_recording_age: 24h

upload:
  cover_dir: "./uploads/covers"
  cover_public_url: "/api/uploads/covers"
  post_image_dir: "./uploads/posts"
  post_public_url: "/api/uploads/posts"

users:
  service_url: "http://127.0.0.1:8090"
  grpc_addr: "127.0.0.1:19090"
